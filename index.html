<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>العيادات dental</title>
<link rel="icon" href="logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Jost:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef4f9;--panel:#fff;--ink:#0f2a3d;--mute:#587186;--line:#d3e1ec;--accent:#2b6a99;--accent-ink:#fff;--danger:#b3261e;--flow:#2b6a99}
@media (prefers-color-scheme:dark){:root{--bg:#0b1721;--panel:#12232f;--ink:#e8f1f7;--mute:#8fa6b6;--line:#21384a;--accent:#5aa7de;--accent-ink:#061a26;--danger:#ff8a80;--flow:#5aa7de}}
*{box-sizing:border-box}
body{margin:0;font-family:"IBM Plex Sans Arabic",Tahoma,sans-serif;background:var(--bg);color:var(--ink);font-size:15px}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:8px 14px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.link{border:0;background:none;color:var(--accent);padding:4px 8px}
button.link.del{color:var(--danger)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input,select{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel)}
label{display:block;margin-bottom:12px;color:var(--mute);font-size:13px}
label input,label select{margin-top:4px;color:var(--ink);font-size:15px}
#login{position:relative;z-index:1;width:calc(100% - 28px);max-width:380px;margin:9vh auto 0;background:var(--panel);padding:34px 30px 30px;border-radius:14px;border:1px solid var(--line);box-shadow:0 18px 50px -28px rgba(20,60,95,.45)}
#login button.primary{width:100%;padding:11px;font-weight:500;margin-top:4px}
#login button.primary:hover{filter:brightness(1.08)}
#login input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px color-mix(in srgb,var(--accent) 22%,transparent)}
.flow{position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;color:var(--flow)}
body.in .flow{display:none}
.sub{text-align:center;color:var(--mute);margin:-6px 0 24px;font-size:14px}
#login h1{display:none}
.logo{display:block;margin:0 auto 10px;width:120px}
.name{text-align:center;margin-bottom:24px;line-height:1}
.name b{display:block;font-family:Jost,"IBM Plex Sans Arabic",sans-serif;font-weight:500;font-size:40px;letter-spacing:.16em;padding-inline-start:.16em;color:var(--accent)}
.name span{display:flex;align-items:center;gap:12px;justify-content:center;margin-top:10px;color:var(--mute);font-weight:500;font-size:16px}
.name span::before,.name span::after{content:"";width:34px;height:1.5px;background:var(--accent);opacity:.45;border-radius:2px}
.brand{display:flex;align-items:center;gap:9px;margin-inline-end:14px}
.brand .bn{display:flex;flex-direction:column;line-height:1;gap:3px}
.brand b{font-family:Jost,sans-serif;font-weight:500;font-size:19px;letter-spacing:.12em;color:var(--accent)}
.brand i{font-style:normal;font-size:11px;color:var(--mute);font-weight:500}
.brand img{width:30px;height:30px;object-fit:contain}
@media (prefers-color-scheme:dark){.logo,.brand img{filter:brightness(1.5)}}
#app{display:none;min-height:100vh}
#side{width:240px;flex:none;position:sticky;top:0;height:100vh;overflow-y:auto;background:var(--panel);border-inline-end:1px solid var(--line);transition:width .18s}
#nav{display:flex;flex-direction:column;gap:4px;padding:12px 10px;min-height:100%}
.content{flex:1;min-width:0}
.sh{display:flex;align-items:center;justify-content:space-between;padding:4px 4px 14px}
.sh .brand{margin:0}
.sp{flex:1}
.who{font-size:13px;color:var(--mute);padding:6px 12px}
.item{display:flex;align-items:center;gap:12px;width:100%;border:0;background:none;color:var(--mute);padding:10px 12px;border-radius:8px;text-align:right}
.item:hover{background:color-mix(in srgb,var(--accent) 10%,transparent);color:var(--ink)}
.item.on{background:var(--accent);color:var(--accent-ink)}
.item svg,#collapse svg,#burger svg{width:20px;height:20px;flex:none;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
#collapse,#burger{border:0;background:none;color:var(--mute);padding:6px;border-radius:6px;display:flex}
#collapse svg{transition:transform .18s}
.topbar,#scrim{display:none}
@media (min-width:821px){
  #app.col #side{width:68px}
  #app.col .lbl{display:none}
  #app.col .item{justify-content:center;padding:10px}
  #app.col .sh{flex-direction:column;gap:12px}
  #app.col #collapse svg{transform:rotate(180deg)}
}
@media (max-width:820px){
  #collapse{display:none}
  #side{position:fixed;top:0;bottom:0;inset-inline-start:0;z-index:30;transform:translateX(100%);transition:transform .2s;box-shadow:-10px 0 30px -12px #0006}
  body.menu #side{transform:none}
  body.menu #scrim{display:block;position:fixed;inset:0;background:#0006;z-index:20}
  .topbar{display:flex;align-items:center;gap:10px;padding:8px 12px;background:var(--panel);border-bottom:1px solid var(--line)}
}
main{padding:20px 16px;max-width:1100px;margin:auto}
.bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.bar h2{margin:0;font-size:19px}
.wrap{overflow-x:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th,td{padding:10px 12px;text-align:right;border-bottom:1px solid var(--line);white-space:nowrap}
th{color:var(--mute);font-weight:500;font-size:13px}
tr:last-child td{border-bottom:0}
.empty{padding:28px;text-align:center;color:var(--mute)}
dialog{border:1px solid var(--line);border-radius:10px;background:var(--panel);color:var(--ink);width:min(440px,94vw);padding:22px}
dialog::backdrop{background:#0008}
.row{display:flex;gap:8px;justify-content:flex-start;margin-top:8px}
.err{color:var(--danger);min-height:20px;margin:6px 0}
.grp{margin-bottom:12px;color:var(--mute);font-size:13px}
.chk{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:6px}
.chk label.c{display:inline-flex;align-items:center;gap:6px;margin:0;color:var(--ink);font-size:14px}
.chk input{width:auto;margin:0}
.grp-h{margin:20px 0 10px;font-size:14px;color:var(--mute);font-weight:500}
.grp-h:first-child{margin-top:4px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
.tile{display:flex;flex-direction:column;align-items:flex-start;gap:14px;min-height:98px;padding:16px;text-align:right;border-radius:10px}
.tile:hover{border-color:var(--accent);box-shadow:0 6px 18px -12px var(--accent)}
.tile .tn{font-size:18px;font-weight:600}
.tile .tc{margin-top:auto;font-size:13px;color:var(--accent)}
#rback{margin-bottom:10px;padding-inline-start:0}
.tools{display:flex;gap:12px;align-items:flex-end;flex-wrap:wrap;margin-bottom:14px}
.tools label{margin:0;min-width:150px}
tfoot td{font-weight:600;background:color-mix(in srgb,var(--accent) 8%,transparent)}
dialog.wide{width:min(900px,96vw);max-height:92vh;overflow:auto}
.chart{direction:ltr;margin:8px 0 14px}
.arch{display:flex;justify-content:center;gap:4px;margin-bottom:8px}
.arch .gap{width:16px}
.tooth{width:36px;height:40px;padding:0;border-radius:8px 8px 14px 14px;font-size:12px}
.tooth:disabled{opacity:1;cursor:default}
.tooth.done{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 16%,var(--panel))}
.tooth.sel{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.alert{background:color-mix(in srgb,var(--danger) 12%,transparent);color:var(--danger);padding:8px 12px;border-radius:8px;margin:8px 0;font-size:14px}
.sec{margin:18px 0 8px;font-weight:600}
.flex{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}
.flex label{margin:0}
.flex input,.flex select{width:auto}
.rxrow{display:grid;grid-template-columns:2fr 2fr 1fr auto;gap:6px;margin-bottom:6px}
textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:6px;background:var(--panel);font:inherit;color:inherit;min-height:60px}
#print{display:none}
@media print{body.printing>*:not(#print){display:none!important}body.printing #print{display:block;padding:24px;color:#000;background:#fff}}
.hint{font-size:12px;color:var(--mute);margin:-6px 0 12px}
</style>
</head>
<body>

  <main>

    <div class="wrap" id="tbl"></div>

</div>

<div id="print"></div>
<dialog id="vis" class="wide"><div id="vbody"></div></dialog>
<dialog id="pf" class="wide"><div id="pbody"></div></dialog>
<dialog id="imp" style="width:min(520px,94vw)">

  <label>الفرع اللي الجهاز فيه<select id="ibr"></select></label>
  <label>ملف CSV (من Excel: Save As ← CSV)<input type="file" id="ifile" accept=".csv,.txt,text/csv"></label>
  <div id="imap"></div>
  <div class="hint" id="iprev" style="font-size:13px;margin:8px 0"></div>
  <div class="err" id="ierr"></div>
  <div class="row"><button class="primary" id="irun" disabled>استيراد</button><button id="iclose">إغلاق</button></div>
</dialog>
<dialog id="dlg">
  <h3 id="dt" style="margin-top:0"></h3>
  <div id="fields"></div>
  <div class="err" id="ferr"></div>
  <div class="row"><button class="primary" id="save">حفظ</button><button id="cancel">إلغاء</button></div>
</dialog>

<script>

let session = null, tab = null, D = {}, editing = null, roomBranch = null;

async function api(body) {
  const r = await fetch(API_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain' },
    body: JSON.stringify({ token: session && session.token, ...body }) });
  const j = await r.json();
  if (!j.ok) throw new Error(j.error);
  return j.data;
}
const can = p => session.user.perms.includes('*') || session.user.perms.includes(p);

async function login() {
  $('lerr').textContent = '';
  try {
    session = await api({ action: 'login', username: $('u').value.trim(), password: $('p').value });
    sessionStorage.setItem('s', JSON.stringify(session));
    start();
  } catch (e) { $('lerr').textContent = e.message; }
}

let V = null, P = null;
const R = (a, b) => Array.from({ length: Math.abs(b - a) + 1 }, (_, i) => a + (b >= a ? i : -i));
const chartHtml = (sel, hist, ro) => {
  const t = n => `<button type="button" class="tooth ${sel.includes(String(n)) ? 'sel' : ''} ${hist[n] ? 'done' : ''}" ${ro ? 'disabled' : `data-t="${n}"`} title="${esc((hist[n] || []).join('، '))}">${n}</button>`;
  const row = (a, b) => `<div class="arch">${a.map(t).join('')}<span class="gap"></span>${b.map(t).join('')}</div>`;
  return `<div class="chart">${row(R(18, 11), R(21, 28))}${row(R(48, 41), R(31, 38))}</div>`;
};
const histOf = vs => {
  const h = {};
  vs.forEach(v => { try { JSON.parse(v.items || '[]').forEach(i => { if (i.tooth) (h[i.tooth] = h[i.tooth] || []).push(i.proc + ' (' + v.date + ')'); }); } catch (e) {} });
  return h;
};
const costOf = items => items.reduce((s, i) => s + (+((D.Procedures.find(p => p.name === i.proc) || {}).materialsCost) || 0) * (+i.qty || 1), 0);
const totOf = items => items.reduce((s, i) => s + (+i.price || 0) * (+i.qty || 1), 0);
const sumHtml = () => `الإجمالي: ${money(totOf(V.items))} جنيه` + (can('costs') ? ` <span class="hint">— تكلفة الأدوات ${money(costOf(V.items))} / الربح ${money(totOf(V.items) - costOf(V.items))}</span>` : '');
const filesHtml = (list, delAttr) => (list.length ? list.map(f => `<button type="button" class="link" data-f="${esc(f.driveId)}">${esc(f.name)} (${esc(f.date)})</button><button type="button" class="link del" data-fx="${esc(f.id)}">حذف</button>`).join('<br>') : '<span class="hint">مفيش ملفات.</span>');

const shrink = file => new Promise(res => { const img = new Image(); img.onload = () => { const k = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = img.width * k; c.height = img.height * k; c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); c.toBlob(res, 'image/jpeg', .82); }; img.src = URL.createObjectURL(file); });
async function uploadFor(file, patient, visit) {
  let blob = file, mime = file.type, name = file.name;
  if (file.type.startsWith('image/')) { blob = await shrink(file); mime = 'image/jpeg'; name = name.replace(/\.\w+$/, '') + '.jpg'; }
  else if (file.size > 4e6) throw new Error('الملف كبير (أقصى 4 ميجا)');
  const data = await new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result.split(',')[1]); fr.readAsDataURL(blob); });
  return api({ action: 'uploadFile', patient, visit, name, mime, data });
}
async function openFile(driveId) {
  try {
    const r = await api({ action: 'getFile', driveId });
    const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([Uint8Array.from(atob(r.data), c => c.charCodeAt(0))], { type: r.mime })); a.target = '_blank'; a.click();
  } catch (e) { alert(e.message); }
}
async function delFile(id) {

  ['otMin', 'إضافي (د)'], ['hours', 'ساعات'], ['salary', 'المرتب'], ['otPay', 'الإضافي'], ['commission', 'النسبة'], ['bonus', 'مكافآت'], ['lateDed', 'خصم تأخير'],

const PAYSUM = ['salary', 'otPay', 'commission', 'bonus', 'lateDed', 'absDed', 'adjDed', 'net'];

async function showPayroll() {
  $('tbl').className = ''; $('q').style.display = 'none'; $('title').textContent = 'كشف المرتبات'; $('add').style.display = 'none';
  if (!D.Branches) await load('Branches');
  const bar = `<div class="tools"><label>الشهر<input type="month" id="pm" value="${payMonth}"></label><label>الفرع<select id="pb"><option value="">كل الفروع</option>${branchOpts(payBranch)}</select></label><button class="primary" id="pcalc">احسب</button>${payRows.length ? '<button id="pcsv">تصدير CSV</button>' : ''}</div>`;
  const tot = c => PAYSUM.includes(c) ? money(payRows.reduce((s, r) => s + r[c], 0)) : '';
  $('tbl').innerHTML = bar + (payRows.length
    ? '<div class="wrap"><table><thead><tr>' + PAYCOLS.map(c => `<th>${c[1]}</th>`).join('') + '</tr></thead><tbody>' +
      payRows.map(r => '<tr>' + PAYCOLS.map(c => `<td>${PAYSUM.includes(c[0]) || c[0] === 'base' ? money(r[c[0]]) : esc(r[c[0]])}</td>`).join('') + '</tr>').join('') +
      '</tbody><tfoot><tr>' + PAYCOLS.map((c, i) => `<td>${i === 0 ? 'الإجمالي (' + payRows.length + ')' : tot(c[0])}</td>`).join('') + '</tr></tfoot></table></div>'
    : '<div class="empty">اختار الشهر (والفرع لو عايز) وادوس "احسب".</div>');
}

function csvPay() {
  const q = v => '"' + String(v ?? '').replace(/"/g, '""') + '"';
  const t = '\uFEFF' + [PAYCOLS.map(c => q(c[1])).join(',')].concat(payRows.map(r => PAYCOLS.map(c => q(r[c[0]])).join(','))).join('\r\n');
  const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([t], { type: 'text/csv;charset=utf-8' })); a.download = 'payroll-' + payMonth + '.csv'; a.click();
}

// ---- استيراد ملف البصمة (CSV) ----
function csvRows(t) {
  const L = t.replace(/^\uFEFF/, '').split(/\r?\n/).filter(l => l.trim());
  if (!L.length) return [];
  const d = [',', ';', '\t'].map(c => [c, L[0].split(c).length]).sort((a, b) => b[1] - a[1])[0][0];
  return L.map(l => l.split(d).map(x => x.trim().replace(/^"|"$/g, '')));
}
function parseDT(a, b, df) {
  const s = (a + ' ' + (b || '')).replace(/[٠-٩]/g, c => '٠١٢٣٤٥٦٧٨٩'.indexOf(c)).trim();
  const m = s.match(/(\d{1,4})[\/\-.](\d{1,2})[\/\-.](\d{1,4})/); if (!m) return null;
  let y, mo, d;
  if (m[1].length === 4) { y = +m[1]; mo = +m[2]; d = +m[3]; }
  else { y = +m[3]; if (y < 100) y += 2000; if (df) { d = +m[1]; mo = +m[2]; } else { mo = +m[1]; d = +m[2]; } if (mo > 12) [mo, d] = [d, mo]; }
  const t = s.slice(m.index + m[0].length).match(/(\d{1,2}):(\d{2})(?::\d{2})?\s*([AaPpصم])?/); if (!t) return null;
  let h = +t[1]; const ap = t[3] || '';
  if (/[Ppم]/.test(ap) && h < 12) h += 12;
  if (/[Aaص]/.test(ap) && h === 12) h = 0;
  return { date: y + '-' + p2(mo) + '-' + p2(d), time: p2(h) + ':' + t[2] };
}
function impCompute() {
  const ci = +$('icid').value, cd = +$('icd').value, ct = $('ict').value === '' ? -1 : +$('ict').value, df = $('idf').value === '1', map = {};
  let bad = 0;
  impRows.forEach(r => {
    const x = parseDT(r[cd] || '', ct >= 0 ? r[ct] : '', df), fp = (r[ci] || '').trim();
    if (!x || !fp) { bad++; return; }
    const o = map[fp + '|' + x.date] = map[fp + '|' + x.date] || { fp, date: x.date, tin: x.time, tout: x.time };
    if (x.time < o.tin) o.tin = x.time; if (x.time > o.tout) o.tout = x.time;
  });
  impDays = Object.values(map);
  const ds = impDays.map(d => d.date).sort(), f = impDays[0];
  $('iprev').textContent = impDays.length ? `تم قراءة ${impDays.length} يوم حضور (${new Set(impDays.map(d => d.fp)).size} موظف) من ${ds[0]} إلى ${ds[ds.length - 1]}${bad ? ' — اتجاهلت ' + bad + ' سطر' : ''}. مثال: كود ${f.fp} يوم ${f.date} من ${f.tin} إلى ${f.tout}` : 'مش قادر أقرأ تاريخ ووقت من الأعمدة المختارة. غيّر الاختيار.';
  $('irun').disabled = !impDays.length;
}
async function openImport() {
  if (!D.Branches) await load('Branches');
  $('ibr').innerHTML = branchOpts(''); $('imap').innerHTML = ''; $('iprev').textContent = ''; $('ierr').textContent = ''; $('irun').disabled = true; $('ifile').value = '';
  $('imp').showModal();
}
$('ifile').onchange = async () => {
  const f = $('ifile').files[0]; if (!f) return;
  const all = csvRows(await f.text()); if (!all.length) { $('ierr').textContent = 'الملف فاضي'; return; }
  const hasHdr = !/\d{1,4}[\/\-.]\d{1,2}[\/\-.]\d{1,4}/.test(all[0].join(' '));
  const names = hasHdr ? all[0] : all[0].map((_, i) => 'عمود ' + (i + 1));
  impRows = hasHdr ? all.slice(1) : all;
  let ci = names.findIndex(n => /(^|[^a-z])(id|no|code)|كود|رقم/i.test(n) && !/name|اسم/i.test(n)); if (ci < 0) ci = 0;
  let cd = names.findIndex(n => /date|تاريخ/i.test(n)), ct = names.findIndex((n, i) => i !== cd && /time|وقت/i.test(n));
  if (cd < 0) { cd = ct; ct = -1; } if (cd < 0) cd = Math.min(1, names.length - 1);
  const opt = (sel, none) => (none ? '<option value="">— مفيش —</option>' : '') + names.map((n, i) => `<option value="${i}" ${i === sel ? 'selected' : ''}>${esc(n)}</option>`).join('');
  $('imap').innerHTML = `<label>عمود كود الموظف (البصمة)<select id="icid">${opt(ci)}</select></label><label>عمود التاريخ/الوقت<select id="icd">${opt(cd)}</select></label><label>عمود وقت منفصل (لو موجود)<select id="ict">${opt(ct, 1)}</select></label><label>ترتيب التاريخ<select id="idf"><option value="1">يوم/شهر/سنة</option><option value="0">شهر/يوم/سنة</option></select></label>`;
  $('ierr').textContent = ''; impCompute();
};
$('imap').onchange = impCompute;
$('irun').onclick = async () => {
  $('irun').disabled = true; $('ierr').textContent = '';
  let added = 0, updated = 0; const unk = new Set();
  try {
    for (let i = 0; i < impDays.length; i += 1500) {
      $('iprev').textContent = `جاري الرفع… ${Math.min(i + 1500, impDays.length)} / ${impDays.length}`;
      const r = await api({ action: 'importAttendance', branch: $('ibr').value, days: impDays.slice(i, i + 1500) });
      added += r.added; updated += r.updated; r.unknown.forEach(x => unk.add(x));
    }
    $('iprev').textContent = `تم: ${added} يوم جديد، ${updated} اتحدّث.` + (unk.size ? ` أكواد بصمة مش مربوطة بموظف: ${[...unk].join('، ')} — حط الكود في خانة "كود البصمة" عند الموظف.` : '');
  } catch (e) { $('ierr').textContent = e.message; $('irun').disabled = false; }
};
$('iclose').onclick = () => { $('imp').close(); if (tab === 'Attendance') show('Attendance'); };

const plural = n => n === 0 ? 'مفيش غرف' : n === 1 ? 'غرفة واحدة' : n === 2 ? 'غرفتين' : n + (n <= 10 ? ' غرف' : ' غرفة');

// تبويب الغرف: مربعات للفروع، ولما تدوس على فرع تفتح صفحة غرفه
async function showRooms() {
  $('tbl').className = ''; $('q').style.display = 'none';
  $('tbl').innerHTML = '<div class="empty">جاري التحميل…</div>';
  try {
    const [bs, rs] = await Promise.all([load('Branches'), load('Rooms')]);
    if (!roomBranch) {
      $('title').textContent = 'الغرف'; $('add').style.display = 'none';
      const mine = bs.filter(b => session.user.all || !session.user.branch || b.name === session.user.branch), groups = {};
      mine.forEach(b => (groups[b.address || 'الفروع'] = groups[b.address || 'الفروع'] || []).push(b));
      $('tbl').innerHTML = Object.keys(groups).map(g => `<div class="grp-h">${esc(g)}</div><div class="tiles">` +
        groups[g].map(b => `<button class="tile" data-b="${esc(b.name)}"><span class="tn">${esc(b.name)}</span><span class="tc">${plural(rs.filter(r => r.branch === b.name).length)}</span></button>`).join('') +
        '</div>').join('') || '<div class="empty">مفيش فروع لسه. ضيف فروعك من تبويب "الفروع".</div>';
    } else {
      const mine = rs.filter(r => r.branch === roomBranch);
      $('title').textContent = 'غرف فرع ' + roomBranch; $('add').textContent = 'إضافة غرفة'; $('add').style.display = can('branches') ? '' : 'none';
      $('tbl').innerHTML = '<button class="link" id="rback">رجوع لكل الفروع</button><div class="wrap">' + (mine.length
        ? '<table><thead><tr><th>الغرفة</th><th></th></tr></thead><tbody>' + mine.map(r => `<tr><td>${esc(r.name)}</td><td>${can('branches') ? `<button class="link" data-e="${esc(r.id)}">تعديل</button><button class="link del" data-d="${esc(r.id)}">حذف</button>` : ''}</td></tr>`).join('') + '</tbody></table>'
        : `<div class="empty">مفيش غرف في فرع ${esc(roomBranch)} لسه. دوس "إضافة غرفة" لتبدأ.</div>`) + '</div>';
    }
  } catch (e) { $('tbl').innerHTML = `<div class="empty">${esc(e.message)}</div>`; }
}

async function openForm(row) {
  const S = SCHEMA[tab]; editing = row || {};
  const need = { doc: 'Employees', rm: 'Rooms', pt: 'Patients' };
  for (const [, , ty] of S.f) { const t = /^(sel|multi):/.test(ty) ? ty.split(':')[1] : need[ty]; if (t && !D[t]) await load(t); }
  $('dt').textContent = (row && row.id ? 'تعديل ' : 'إضافة ') + ({ Employees: 'موظف', Roles: 'دور', Branches: 'فرع', Rooms: 'غرفة', Procedures: 'إجراء', Schedules: 'جدول دكتور', Patients: 'مريض', Appointments: 'ميعاد', Attendance: 'حضور', Adjustments: 'مكافأة/خصم', Settings: 'إعداد' }[tab] || S.label); $('ferr').textContent = '';
  $('fields').innerHTML = S.f.filter(f => !(f[3] && !can('costs'))).map(([k, l, ty]) => {
    const v = esc(editing[k]);
    let inp;
    if (ty === 'doc') inp = `<select name="${k}">` + D.Employees.filter(o => String(o.role).split(',').includes('دكتور')).map(o => `<option ${o.name === editing[k] ? 'selected' : ''}>${esc(o.name)}</option>`).join('') + '</select>';
    else if (ty === 'rm') inp = `<select name="${k}"></select>`;
    else if (ty === 'pt') inp = `<input name="${k}" list="ptl" value="${v}"><datalist id="ptl">` + D.Patients.map(o => `<option value="${esc(o.name)} - ${esc(o.phone)}">`).join('') + '</datalist>';
    else if (ty.startsWith('sel:')) inp = `<select name="${k}">` + D[ty.slice(4)].filter(o => ty !== 'sel:Branches' || session.user.all || !session.user.branch || o.name === session.user.branch).map(o => `<option ${o.name === editing[k] ? 'selected' : ''}>${esc(o.name)}</option>`).join('') + '</select>';
    else if (ty.startsWith('multi:')) inp = `<div class="chk" data-name="${k}">` + D[ty.slice(6)].map(o => `<label class="c"><input type="checkbox" value="${esc(o.name)}" ${String(editing[k] || '').split(',').includes(o.name) ? 'checked' : ''}> ${esc(o.name)}</label>`).join('') + '</div>';
    else if (ty.startsWith('opt:')) inp = `<select name="${k}">` + ty.slice(4).split(',').map(o => `<option ${o === editing[k] ? 'selected' : ''}>${o}</option>`).join('') + '</select>';
    else inp = `<input name="${k}" type="${ty}" value="${v}">`;
    return ty.startsWith('multi:') ? `<div class="grp"><span>${l}</span>${inp}</div>` : `<label>${l}${inp}</label>`;
  }).join('') + (S.hint ? `<div class="hint">${S.hint}</div>` : '') +
    (tab === 'Employees' ? '<label>كلمة سر الدخول (املاها لو عايز تنشئ أو تغيّر المستخدم)<input name="_pw" type="password" autocomplete="new-password"></label>' : '');
  const el = n => document.querySelector(`#fields [name="${n}"]`);
  const fillRooms = () => { const r = el('room'); if (!r) return; r.innerHTML = D.Rooms.filter(x => x.branch === el('branch').value).map(x => `<option ${x.name === editing.room ? 'selected' : ''}>${esc(x.name)}</option>`).join(''); };
  if (el('room')) { fillRooms(); el('branch').onchange = fillRooms; }
  if (el('procedure')) { el('procedure').onchange = () => { const p = D.Procedures.find(x => x.name === el('procedure').value); if (p) el('duration').value = p.duration; }; if (!editing.duration) el('procedure').onchange(); }
  $('dlg').showModal();
}

async function saveForm() {
  const row = { ...editing }; let pw;
  document.querySelectorAll('#fields [name]').forEach(el => { if (el.name === '_pw') pw = el.value; else row[el.name] = el.value; });
  document.querySelectorAll('#fields .chk').forEach(c => { row[c.dataset.name] = [...c.querySelectorAll('input:checked')].map(i => i.value).join(','); });
  $('save').disabled = true;
  try { await api({ action: 'save', table: tab, row, password: pw }); $('dlg').close(); delete D[tab]; show(tab); }
  catch (e) { $('ferr').textContent = e.message; }
  $('save').disabled = false;
}

async function demo(a) {
  if (!confirm(a === 'seedDemo' ? 'هيتم إضافة بيانات تجريبية (غرف وموظفين وجداول ومرضى ومواعيد) وممكن ياخد حوالي نص دقيقة. متابعة؟' : 'هيتم مسح البيانات التجريبية فقط. متابعة؟')) return;
  $('title').textContent = 'جاري التنفيذ… استنى شوية';
  try { await api({ action: a }); D = {}; alert('تم'); } catch (e) { alert(e.message); }
  show(tab);
}
$('lbtn').onclick = login;
$('p').onkeydown = e => { if (e.key === 'Enter') login(); };
$('tbl').onchange = e => {
  const i = e.target.id, v = e.target.value;
  if (i === 'am') { attMonth = v; show('Attendance'); } else if (i === 'ab') { attBranch = v; show('Attendance'); }
  else if (i === 'pm') payMonth = v; else if (i === 'pb') payBranch = v;
};
$('add').onclick = () => openForm(tab === 'Rooms' && roomBranch ? { branch: roomBranch } : null);
$('q').oninput = () => document.querySelectorAll('#tbl tbody tr').forEach(tr => { tr.style.display = tr.textContent.includes($('q').value) ? '' : 'none'; });
$('cancel').onclick = () => $('dlg').close();
$('save').onclick = saveForm;
$('tbl').onclick = async e => {
  if (e.target.id === 'aimp') return openImport();
  if (e.target.id === 'pcsv') return csvPay();
  if (e.target.id === 'pcalc') {
    e.target.disabled = true;
    try { payRows = await api({ action: 'payroll', month: payMonth, branch: payBranch }); } catch (x) { alert(x.message); }
    return showPayroll();
  }
  const bv = e.target.dataset.v, bp = e.target.dataset.p;
  if (bv) return openVisit({ appt: D.Appointments.find(r => String(r.id) === bv) });
  if (bp) return openPatient(D.Patients.find(r => String(r.id) === bp));
  if (tab === 'Visits' && e.target.dataset.e) return openVisit(D.Visits.find(r => String(r.id) === e.target.dataset.e));
  const tl = e.target.closest('.tile');
  if (tl) { roomBranch = tl.dataset.b; return show('Rooms'); }
  if (e.target.id === 'rback') { roomBranch = null; return show('Rooms'); }
  const id = e.target.dataset.e || e.target.dataset.d; if (!id) return;
  if (e.target.dataset.e) openForm(D[tab].find(r => String(r.id) === id));
  else if (confirm('متأكد إنك عايز تحذف؟')) { try { await api({ action: 'remove', table: tab, id }); delete D[tab]; show(tab); } catch (x) { alert(x.message); } }
};
const saved = sessionStorage.getItem('s'); if (saved) { session = JSON.parse(saved); start(); }
